[project]
name = "hirexp-ai"
version = "1.0.0"
description = "Hirexp Ai - Resume screening with AI-powered interview using interactive AI avatars."
authors = [{ name = "Hirexp Team" }]
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "pymupdf>=1.24.0",
    "scikit-learn>=1.4.0",
    "anthropic>=0.25.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "pillow>=10.3.0",
    "reportlab>=4.1.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "off"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

